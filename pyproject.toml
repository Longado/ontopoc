[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontopoc"
version = "0.1.0"
description = "An ontology draft from business tables or a document: the model proposes, code checks every row, a person confirms"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
check = ["rdflib>=7", "pyshacl>=0.26"]   # tests read the Turtle export back; the service does not need them

[project.scripts]
ontopoc-recall = "ontology_poc_generator.recall_cli:main"
ontopoc-mcp = "ontology_poc_generator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

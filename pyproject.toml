[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontopoc"
version = "0.2.0"
description = "An ontology draft from business tables or a document: the model drafts, code checks the draft against the data, a person confirms"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
sources = ["pg8000>=1.30", "PyMySQL[rsa]>=1.1"]   # live PostgreSQL and MySQL sources, imported only when a source is opened. [rsa] is the cryptography package: a MySQL 8 account (caching_sha2_password) cannot log in over a connection without TLS, the local default, without it
check = ["rdflib>=7", "pyshacl>=0.26"]   # tests read the Turtle export back; the service does not need them

[project.scripts]
ontopoc-recall = "ontology_poc_generator.recall_cli:main"
ontopoc-mcp = "ontology_poc_generator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

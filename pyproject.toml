[build-system]
requires = ["setuptools>=77"]   # 77: the SPDX license string and license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "ontopoc"
version = "0.2.1"   # also in server.json and src/ontology_poc_generator/__init__.py; scripts/check_release_version.py checks them against the tag
description = "An ontology draft from business tables or a document: the model drafts, code checks the draft against the data, a person confirms"
readme = "README.en.md"   # the PyPI page; its mcp-name line is what the MCP Registry checks
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Yutai Lin"}]
keywords = ["ontology", "mcp", "mcp-server", "semantic-layer", "data-modeling", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
sources = ["pg8000>=1.30", "PyMySQL[rsa]>=1.1"]   # live PostgreSQL and MySQL sources, imported only when a source is opened. [rsa] is the cryptography package: a MySQL 8 account (caching_sha2_password) cannot log in over a connection without TLS, the local default, without it
check = ["rdflib>=7", "pyshacl>=0.26"]   # tests read the Turtle export back; the service does not need them

[project.urls]
Homepage = "https://longado.github.io/ontopoc/"
Source = "https://github.com/Longado/ontopoc"
Issues = "https://github.com/Longado/ontopoc/issues"
Changelog = "https://github.com/Longado/ontopoc/releases"

[project.scripts]
ontopoc = "ontology_poc_generator.cli:main"   # the MCP server: what `uvx ontopoc` and the MCP Registry entry run
ontopoc-recall = "ontology_poc_generator.recall_cli:main"
ontopoc-mcp = "ontology_poc_generator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontopoc"
version = "0.1.0"
description = "Recall scope review over public data: auto-built ontology, code-verified, human-reviewed"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ontopoc-recall = "ontology_poc_generator.recall_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
